<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the page may paint under the notch and the home
         indicator, which env(safe-area-inset-*) then pads (tab bar, FAB, sheets).
         interactive-widget=resizes-content: Chrome on Android shrinks the layout
         viewport for the on-screen keyboard instead of only the visual one, so
         fixed and *vh surfaces follow it; iOS Safari has no such switch, which is
         what ui/viewport.ts measures for. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#EEF1F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)" />
    <title>Personal Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The glass lens: a displacement map the sliding pill references through
      backdrop-filter. Two definitions, one use, no effect until ui/lens.ts
      turns on html[data-lens] for a browser that can render it.
    -->
    <svg class="glass-lens-map" width="0" height="0" aria-hidden="true" focusable="false">
      <filter
        id="glass-lens"
        x="-10%"
        y="-10%"
        width="120%"
        height="120%"
        color-interpolation-filters="sRGB"
      >
        <!-- low-frequency noise bends the backdrop like a thick edge -->
        <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" seed="3" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="1.5" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="12" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
