[package]
name = "planner"
version = "0.1.0"
description = "Personal Planner desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
planner-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8.1"
# Idle probe (idle.rs): GetLastInputInfo + GetTickCount64. Version matches the
# windows-core already in the lock file so no second copy is pulled in.
windows = { version = "0.62", features = ["Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
tauri-winrt-notification = "0.8"
