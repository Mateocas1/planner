[package]
name = "planner"
version = "0.1.0"
description = "Personal Planner desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8.1"
