[package]
name = "planner"
version = "0.1.0"
description = "Personal Planner desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
planner-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tauri-plugin-autostart = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8.1"
# T12 (memory.rs): SetMemoryUsageTargetLevel on ICoreWebView2_19, reached
# through with_webview. Same 0.39 series as the webview2-com in the lock file
# (wry 0.57's), so the COM interfaces are one crate, not two copies.
webview2-com = "0.39"
# Idle probe (idle.rs): GetLastInputInfo + GetTickCount64. Version matches the
# windows-core already in the lock file so no second copy is pulled in.
windows = { version = "0.62", features = ["Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
tauri-winrt-notification = "0.8"
# Chat key storage (spec S3): Windows Credential Manager through the
# windows-native backend, so no secret-service/dbus dependency is pulled in.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
