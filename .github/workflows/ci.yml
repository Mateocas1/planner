name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  core:
    name: Rust core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri/core
      - run: cargo test
